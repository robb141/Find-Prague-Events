name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Prague

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lint Python (ruff)
        run: |
          python3 -m pip install ruff
          ruff check .

      - name: Lint JS (eslint)
        run: npx --yes eslint script.js sw.js

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
